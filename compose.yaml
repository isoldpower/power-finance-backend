# See README.md → "Docker"
include:
  - services/write-service/compose.yaml
  - services/read-service/compose.yaml
  - services/push-service/compose.yaml
  - services/webhook-service/compose.yaml
  - services/antifraud-service/compose.yaml

services:
  api-gateway:
    build:
      context: ./infrastructure/kong
      dockerfile: Dockerfile
    image: power-finance/api-gateway:dev
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000 http2, 0.0.0.0:8443 http2 ssl"
      KONG_NGINX_PROXY_PROXY_BUFFERING: "off"
      KONG_NGINX_PROXY_PROXY_READ_TIMEOUT: "3600s"
      KONG_NGINX_PROXY_PROXY_SEND_TIMEOUT: "3600s"
      KONG_PLUGINS: "bundled,clerk-jwt,read-at-least,write-ral-version,user-tier-rate-limit,read-fallback"
      KONG_NGINX_HTTP_LUA_SHARED_DICT: "clerk_jwks_locks 1m"
      CLERK_ISSUER_URL: ${CLERK_ISSUER_URL:-}
      READ_AT_LEAST_HMAC_SECRET: ${READ_AT_LEAST_HMAC_SECRET:-}
    volumes:
      - ./infrastructure/kong/kong.yml:/etc/kong/kong.yml:ro
      - ./infrastructure/kong/plugins/clerk-jwt:/usr/local/share/lua/5.1/kong/plugins/clerk-jwt:ro
      - ./infrastructure/kong/plugins/read-at-least:/usr/local/share/lua/5.1/kong/plugins/read-at-least:ro
      - ./infrastructure/kong/plugins/write-ral-version:/usr/local/share/lua/5.1/kong/plugins/write-ral-version:ro
      - ./infrastructure/kong/plugins/user-tier-rate-limit:/usr/local/share/lua/5.1/kong/plugins/user-tier-rate-limit:ro
      - ./infrastructure/kong/plugins/read-fallback:/usr/local/share/lua/5.1/kong/plugins/read-fallback:ro
    ports:
      - "${GATEWAY_PROXY_PORT:-8080}:8000"
      - "${GATEWAY_ADMIN_PORT:-8001}:8001"
    depends_on:
      write-service:
        condition: service_started
      gateway-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kong health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

