              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/transactions/chains/{chain_id}:
    delete:
      operationId: transaction_chains_delete
      description: Cancels every transaction in the chain. Each one is soft-cancelled
        exactly as a single DELETE would do it, so the ledger keeps the original flows
        and gains their inverses. Cancelling an already-cancelled chain returns 200
        with the same body.
      summary: Cancel a whole chain
      parameters:
      - in: path
        name: chain_id
        schema:
          type: string
          format: uuid
        description: Chain ID
        required: true
      tags:
      - transactions
      security:
      - clerkBearer: []
      responses:
