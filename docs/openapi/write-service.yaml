          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/fallback-reads/wallets/{wallet_id}:
    get:
      operationId: fallback_wallets_retrieve
      summary: Get wallet details (consistent fallback)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Wallet ID
        required: true
      - in: query
        name: period
        schema:
          type: string
          enum:
          - all_time
          - last_month
          - last_week
          - last_year
          default: last_month
        description: 'Window for the `period` inflow/outflow figures. Every value
          is a ROLLING window of whole days ending with today, resolved in your timezone
          preference: `last_week` is the last 7 days, `last_month` the last 30, `last_year`
          the last 365. Today is included.'
      - in: path
        name: wallet_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - fallback-reads
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedWalletDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
