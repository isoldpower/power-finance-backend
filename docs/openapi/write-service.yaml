        required: true
      security:
      - clerkBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedTransactionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/transactions/{transaction_id}:
    patch:
      operationId: transactions_partial_update
      description: 'Edits `name`, `category` and `evidence`. It never touches money:
        the amount lives in an append-only ledger this endpoint has no reach into.
        The response is the PREVIEW shape, so it carries no `evidence` even when the
        request just set one — re-read the detail endpoint for that.'
      summary: Update a transaction's metadata
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Transaction ID
        required: true
      - in: path
        name: transaction_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPatchTransactionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPatchTransactionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPatchTransactionRequest'
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedTransactionResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    delete:
      operationId: transactions_delete
      description: 'Soft-cancels a transaction: an inverse flow is appended to the
        ledger, returning the money to the wallet, and the transaction is stamped
        `deleted_at`. Nothing is erased — the original flow stays in the ledger. The
        response reports the amount the transaction was FOR, not the zero its flows
        now sum to. Repeating the call returns 200 with the same body.'
      summary: Cancel a transaction
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Transaction ID
        required: true
      - in: path
        name: transaction_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - transactions
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedTransactionResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/transactions/{transaction_id}/adjust:
    post:
      operationId: transactions_adjust
      description: 'Restates what a transaction was for. The original is NOT rewritten
        and NOT cancelled: the difference is appended to the ledger as an adjusting
        flow linked back to the opening one, and the transaction''s amount becomes
        the new fold. The id, the creation time and the audit trail all survive.'
      summary: Correct a transaction's amount
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Transaction ID
        required: true
      - in: path
        name: transaction_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - transactions
      requestBody:
        content:
          application/json:
