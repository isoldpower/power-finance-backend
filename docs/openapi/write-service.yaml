components:
  schemas:
    ActionMoney:
      type: object
      properties:
        amount:
          type: string
        currency:
          type: string
      required:
      - amount
      - currency
    ActionResolution:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        intent:
          allOf:
          - $ref: '#/components/schemas/IntentEnum'
          description: |-
            A rendering hint, not behaviour. A client may style all of them identically.

            * `primary` - primary
            * `secondary` - secondary
            * `danger` - danger
        applies:
          type: boolean
          description: Whether choosing it changes OTHER resources.
      required:
      - applies
      - id
      - intent
      - label
    ActionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/SourceEnum'
        kind:
          type: string
          description: An OPEN vocabulary. Use it to pick an icon and fall back to
            a generic one for values you do not know. Never derive labels, button
            counts or behaviour from it — that is what `resolutions` is.
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        title:
          type: string
        body:
          type: string
        subject:
          allOf:
          - $ref: '#/components/schemas/ActionSubject'
          nullable: true
        money:
          allOf:
          - $ref: '#/components/schemas/ActionMoney'
          nullable: true
        group_key:
          type: string
          nullable: true
          description: Collapses recurring conditions onto one row. Null when it does
            not recur.
        occurrences:
          type: integer
          description: 1 for a non-recurring action, never 0.
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolutions:
          type: array
          items:
            $ref: '#/components/schemas/ActionResolution'
          description: Never empty while pending; always empty once answered.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
      required:
      - body
      - created_at
      - deleted_at
      - expires_at
      - group_key
      - id
      - kind
      - last_seen_at
      - money
      - occurrences
      - resolutions
      - resolved_at
      - severity
      - source
      - status
      - subject
      - title
      - updated_at
    ActionSubject:
      type: object
      properties:
        type:
          type: string
          description: A resource name in this API.
        id:
          type: string
      required:
      - id
      - type
    AdjustTransactionRequest:
      type: object
      description: |-
        Restate a transaction's amount. `amount` is the NEW TOTAL, not a delta, and
        a positive magnitude like everywhere else.
      properties:
