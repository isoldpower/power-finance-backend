                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/transactions/chains:
    post:
      operationId: transaction_chains_create
      description: 'Commit several transactions atomically. This is how transfers
        are expressed: a transaction carries one money flow, so moving money between
        wallets is an expense on one and an income on the other, submitted together.
        Because the chain is all-or-nothing, money is never observed as having left
        one wallet without arriving in the other.'
      summary: Create a chain of transactions
      tags:
      - transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionChainRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateTransactionChainRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateTransactionChainRequest'
        required: true
      security:
