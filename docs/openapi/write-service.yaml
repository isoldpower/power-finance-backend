openapi: 3.0.3
info:
  title: Power Finance — Write Service API
  version: 0.1.0
  description: Command side of the CQRS architecture. Synchronous, consistency-oriented
    writes.
paths:
  /api/v1/actions/{action_id}/resolve:
    post:
      operationId: actions_resolve
      description: |-
        Choose one of the action's offered resolutions.

        Choosing one whose `applies` was true performs the described change to other resources as part of the same request, and the response then carries `X-Write-Version` so you can send `Read-At-Least` on the follow-up read. When `applies` was false nothing outside the action changes and no write version is emitted.

        `resolutions` comes back EMPTY: a resolved action offers no further choices, and an empty array rather than a stale list is what stops a client re-rendering buttons that no longer work.

        Answering is terminal — a second answer is 409 `action_already_resolved`. `Idempotency-Key` is optional but recommended for resolutions that apply, since those move real data.
      summary: Answer an action
      parameters:
      - in: path
        name: action_id
        schema:
          type: string
          format: uuid
        description: Action ID
        required: true
      tags:
      - actions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResolveActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResolveActionRequest'
        required: true
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedActionResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/automations:
    post:
      operationId: automations_create
      description: |-
        WHEN something matches, DO something.

        `trigger.filter_body` is the SAME filter tree the `/search` endpoints take, validated against the policy of the trigger's subject: an `event` trigger against transactions, a `schedule` trigger against wallets. `null` means the rule is unconditional.
      summary: Create an automation rule
      tags:
      - automations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutomationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateAutomationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAutomationRequest'
        required: true
      security:
      - clerkBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedAutomationResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/automations/{automation_id}:
    patch:
      operationId: automations_update
      description: |-
        Partial update, including enabling and disabling.

        There is deliberately no `/toggle`: enabling is SETTING a field, and an endpoint that flips a boolean is not idempotent — two retries leave the rule where it started.
      summary: Update an automation rule
      parameters:
      - in: path
        name: automation_id
        schema:
          type: string
          format: uuid
        description: Automation ID
        required: true
      tags:
      - automations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateAutomationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateAutomationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateAutomationRequest'
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedAutomationResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    delete:
      operationId: automations_destroy
      description: Soft delete. The rule stops evaluating immediately and comes back
        with `deleted_at` set.
      summary: Delete an automation rule
      parameters:
      - in: path
        name: automation_id
        schema:
          type: string
          format: uuid
        description: Automation ID
        required: true
      tags:
      - automations
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedAutomationResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/fallback-reads/actions:
    get:
      operationId: fallback_actions_list
      description: |-
        Always-consistent action queue served from the write side. The gateway routes here when the Read Service is not caught up.

        Ordered `severity_rank DESC, created_at DESC, id DESC`, the same as the read side — a cursor minted there has to keep working here.
      summary: List the needs-action queue (consistent fallback)
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100.
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - critical
          - info
          - warning
        description: Restrict to one severity. Absent means all of them.
      - in: query
        name: source
        schema:
          type: string
          enum:
          - assistant
          - scheduler
        description: Restrict to one producer. Absent means both.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - dismissed
          - expired
          - pending
          - resolved
        description: Which queue state to list. Defaults to `pending`.
      tags:
      - fallback-reads
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActionResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/fallback-reads/automations:
    get:
      operationId: fallback_automations_list
      description: Always-consistent automation list served from the write side. The
        gateway routes here when the Read Service is not caught up.
      summary: List automation rules (consistent fallback)
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`.
      - in: query
        name: enabled
        schema:
          type: boolean
        description: Restrict to enabled or disabled endpoints. ABSENT means both
          — it is a tristate, not a boolean defaulting to either value.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100.
      tags:
      - fallback-reads
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAutomationResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/fallback-reads/automations/{automation_id}:
    get:
      operationId: fallback_automations_retrieve
