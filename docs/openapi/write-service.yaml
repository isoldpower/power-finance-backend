            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/goals:
    post:
      operationId: goals_create
      description: Create a savings goal. The goal opens empty — `progress` is derived
        from the transactions that touch it, so a fresh goal is always at zero. Fund
        it with POST /transactions/chains.
      summary: Create a new goal
      tags:
      - goals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
        required: true
      security:
      - clerkBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedGoalResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/goals/{goal_id}:
    patch:
      operationId: goals_partial_update
      description: Partial update of a goal's client-managed metadata. An omitted
        field is left alone. `currency` is fixed at creation and is not accepted;
        `progress` is derived and is ignored if sent.
      summary: Update a goal
      parameters:
      - in: path
        name: goal_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Goal ID
        required: true
      tags:
      - goals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateGoalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateGoalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateGoalRequest'
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedGoalResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    delete:
      operationId: goals_delete
      description: 'Closes the goal (sets deleted_at). The row is preserved so the
        transactions that touched it remain queryable, but the goal leaves lists.
        Only an empty goal closes: `progress` must be zero, otherwise 409 `goal_not_empty`
        — drain it with a transfer chain first. Repeating the call is a no-op that
        returns the same body.'
      summary: Close a goal
      parameters:
      - in: path
        name: goal_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Goal ID
        required: true
      tags:
      - goals
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedGoalResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/notifications/{notification_id}:
    delete:
      operationId: notifications_delete
      description: Permanently remove a notification from the user's inbox.
      summary: Delete a notification
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Notification ID
        required: true
      - in: path
        name: notification_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notifications
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedNotificationResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/notifications/{notification_id}/ack:
    post:
      operationId: notifications_acknowledge
      description: |-
        Mark a notification as read and return it.

        Idempotent by nature, so it needs no `Idempotency-Key`: acknowledging an already-read notification succeeds and returns it unchanged, keeping the original `acknowledged_at`. It is not a 409 - the caller's intent is already satisfied. There is no un-acknowledge.
      summary: Acknowledge a notification
      parameters:
      - in: path
        name: notification_id
        schema:
          type: string
          format: uuid
        description: Notification ID
        required: true
      tags:
      - notifications
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedNotificationResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/notifications/ack:
    post:
      operationId: notifications_batch_acknowledge
      description: |-
        Mark several notifications as read at once. Not in the target document; kept because a bell with twenty unread items needs it.

        Unknown ids are skipped silently rather than failing the batch, and an already-read one keeps its original `acknowledged_at`. The response carries every notification named in the request, in the same shape as `GET /notifications`.
      summary: Acknowledge notifications in batch
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAcknowledgeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BatchAcknowledgeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchAcknowledgeRequest'
        required: true
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/transactions:
    post:
      operationId: transactions_create
      description: 'Record one money flow against a wallet. `amount` is a positive
        magnitude and `type` states the direction. Requires an Idempotency-Key header:
        without one, a dropped response or a double-tapped button creates a duplicate
        the API has no way to detect after the fact.'
      summary: Create a new transaction
      tags:
      - transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
          multipart/form-data:
