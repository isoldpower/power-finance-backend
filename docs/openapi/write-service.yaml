          description: ''
  /api/v1/fallback-reads/webhooks/{webhook_id}/events:
    get:
      operationId: fallback_webhooks_subscriptions_list
      description: Every event type the webhook is subscribed to. Bounded by the event
        catalogue, so this endpoint is not paginated.
      summary: List webhook event subscriptions (consistent fallback)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Webhook ID
        required: true
      - in: path
        name: webhook_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
