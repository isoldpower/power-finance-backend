              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/webhooks/search:
    post:
      operationId: webhooks_search
      description: Retrieve webhook endpoints matching a filter tree passed in the
        request body. POST carries the tree; this is a read in every other respect
