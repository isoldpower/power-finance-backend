      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterWebhooksRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FilterWebhooksRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FilterWebhooksRequest'
        required: true
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWebhookSearchResult'
