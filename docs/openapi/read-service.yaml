  /api/v1/accounts:
    get:
      operationId: accounts_list
      description: |-
        Retrieve a page of your double-entry chart of accounts, newest first. These accounts are derived by the backend from your transactions; they are not created or edited directly.

        `group` narrows the page but never reorders it — assets do not lead liabilities. `meta.groups` reports every group regardless, so the tab labels do not change when a tab is selected.
      summary: List ledger accounts
      parameters:
      - in: query
        name: currency
        schema:
          type: string
          default: USD
          minLength: 1
        description: The currency `lowbar` is expressed in. Unknown codes 422.
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: query
        name: group
        schema:
          enum:
          - all
          - assets
          - liabilities
          - equity
          type: string
          default: all
          minLength: 1
        description: |-
          Narrow the chart to one group. `all` is the default.

          * `all` - all
          * `assets` - assets
          * `liabilities` - liabilities
          * `equity` - equity
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      - in: query
        name: lowbar
        schema:
          type: string
          default: '0'
          minLength: 1
        description: Hide accounts whose balance is smaller than this in MAGNITUDE,
          so a threshold does not silently drop every liability. Money Shape grammar,
          validated against `currency`'s scale.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountPreview'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/accounts/{account_id}:
    get:
      operationId: accounts_retrieve
      description: |-
        Retrieve one ledger account with a page of the postings dispatched into it, newest first. `limit` and `cursor` paginate `history`, reported under `meta.history`.

        `money` is the account's balance in its BOOK currency; each history entry carries the currency of the transaction that produced it, which may differ.
      summary: Get account details
      parameters:
      - in: path
        name: account_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Account ID
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedAccountDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/actions:
    get:
      operationId: actions_list
      description: |+
        Things you must DECIDE about, most urgent first.

        Ordered `severity DESC, created_at DESC, id DESC`. Unlike the notification feed this IS a queue to be worked through, so a critical action outranks an older informational one.

      summary: List the needs-action queue
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - critical
          - info
          - warning
        description: Restrict to one severity. Absent means all of them.
      - in: query
        name: source
        schema:
          type: string
          enum:
          - assistant
          - scheduler
        description: Restrict to one producer. Absent means both.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - dismissed
          - expired
          - pending
          - resolved
        description: Which queue state to list. Defaults to `pending`.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActionPreview'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/automations:
    get:
      operationId: automations_list
      description: |-
        Every rule you have authored, newest first.

        The list returns the COMPLETE resource, not a preview: a rule is small and its condition renders inline, so a detail request would fetch nothing new.

        Ordering is `created_at DESC, id DESC` — the REVERSE of evaluation order. The list shows newest first because that is how you think about your rules; the engine runs oldest first so later rules can override earlier ones.
      summary: List automation rules
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: query
        name: enabled
        schema:
          type: boolean
        description: Restrict to enabled or disabled. ABSENT means both.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAutomation'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/automations/{automation_id}:
    get:
      operationId: automations_retrieve
      description: The identical shape one element of `GET /automations` carries.
        It exists for reading a rule by id; the list already returns everything a
        detail view would show.
      summary: Get one automation rule
      parameters:
      - in: path
        name: automation_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Automation ID
        required: true
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedAutomationDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/currencies:
    get:
      operationId: currencies_list
      description: 'The full ISO-4217 reference table this API accepts. Static, small
        and the same for every caller, so it is NOT paginated: `meta.limit` and both
        cursors are null and the response is always complete. Fetch once at app load.
        `decimals` is the scale every amount in that currency is rendered at.'
      summary: List currencies
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyCollection'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/currencies/convert:
    get:
      operationId: currencies_convert_retrieve
      description: |-
        Converts one amount at the feed's current rate. `from` and `to` are ordinary money objects, each at its own currency's scale; `rate` is the multiplier as a plain string and carries no currency.

        The server rounds once, so `to` is authoritative — a client that multiplies `rate` itself can land on a different last digit.

        An unknown code fails with 422 `unsupported_currency`; a known code with no fresh rate fails with 409 `rate_unavailable`.
      summary: Convert an amount between currencies
      parameters:
      - in: query
        name: amount
        schema:
          type: string
          minLength: 1
        description: Decimal string, validated against `from_code`'s scale. `?amount=100.005&from_code=USD`
          fails with 422 / `amount_precision`.
        required: true
      - in: query
        name: from_code
        schema:
          type: string
          minLength: 1
        required: true
      - in: query
        name: to_code
        schema:
          type: string
          minLength: 1
        required: true
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedConversion'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/currencies/rates/{code}:
    get:
      operationId: currencies_rates_retrieve
      description: |-
        Every rate the feed carries, expressed against the currency in the path. Nothing is converted here, so the field is `base` — the denominator of the map — rather than `from`.

        A code this API does not know fails with 422 `unsupported_currency`. A known code the feed has no fresh reading for fails with 409 `rate_unavailable` rather than returning an old number.
      summary: Get exchange rates against a base currency
      parameters:
      - in: path
        name: code
        schema:
          type: string
        description: ISO-4217 code the rates are expressed against.
        required: true
      - in: query
        name: target
        schema:
          type: array
          items:
            type: string
        description: Restrict the map to these codes. Repeat the param or pass a comma-separated
          list. Absent returns every rate the feed has.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedCurrencyRates'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/goals:
    get:
      operationId: goals_list
      description: Retrieve a page of your savings goals, newest first. Goals do not
        sort by `finish_at` or by completion — a goal does not move in the list because
        its deadline approaches. Closed goals are excluded.
      summary: List goals
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGoalPreview'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/goals/{goal_id}:
    get:
      operationId: goals_retrieve
      description: Retrieve a specific goal with a page of its history. `limit` and
        `cursor` paginate `history`, reported under `meta.history`. A closed goal
        still resolves by id — DELETE removes it from lists, not from existence.
      summary: Get goal details
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: path
        name: goal_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Goal ID
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedGoalDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/metrics:
    get:
      operationId: metrics_retrieve
      description: |-
        All three derived views in one response.

        `balance`, `net-worth` and `cash-flow` are booleans that each default to TRUE - a bare request returns everything. Send `?cash-flow=false` to drop a section; it comes back as `null` rather than disappearing, so the three keys are always present.
      summary: Get the balance sheet, net worth and cash flow
      parameters:
      - in: query
        name: balance
        schema:
          type: boolean
          default: true
        description: Include the `balance` section. Every section defaults to true,
          so a bare request returns all three.
      - in: query
        name: cash-flow
        schema:
          type: boolean
          default: true
        description: Include the `cash_flow` section. Every section defaults to true,
          so a bare request returns all three.
      - in: query
        name: net-worth
        schema:
          type: boolean
          default: true
        description: Include the `net_worth` section. Every section defaults to true,
          so a bare request returns all three.
      - in: query
        name: points
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
        description: Series length, clamped to 1..100 rather than rejected. `meta.points`
          reports what was applied.
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: Day-zero for `net_worth`'s series and for `cash_flow`. Absent
          means all time. It does NOT bound `balance`, which is a snapshot.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedMetrics'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/notifications:
    get:
      operationId: notifications_list
      description: |-
        Retrieve a page of your notifications, newest first.

        Ordering is the global default — `created_at DESC, id DESC`. Unlike the actions queue this is a feed to be read rather than a list to be worked through, so a `critical` notification from Tuesday does NOT outrank an `info` from this morning.
      summary: List notifications
      parameters:
      - in: query
        name: acknowledged
        schema:
          type: boolean
        description: Restrict to read or unread. ABSENT means both — it is a tristate,
          not a boolean defaulting to either value.
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - critical
          - info
          - warning
        description: Restrict to one severity. Absent means all of them.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationPreview'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/notifications/{notification_id}:
    get:
      operationId: notifications_retrieve
      description: Retrieve a specific notification.
      summary: Get notification details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Notification ID
        required: true
      - in: path
        name: notification_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedNotificationDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/notifications/count:
    get:
      operationId: notifications_count_retrieve
      description: |-
        The bell badge, so it does not require walking the list. Not paginated and takes no params.

        This value goes stale the moment the stream delivers a notification. Increment locally on arrival and treat this as the value at load time - refetching per event would defeat the point of having a stream.
      summary: Count unacknowledged notifications
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedNotificationCounts'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/transactions:
    get:
      operationId: transactions_list
      description: Retrieve a page of your transactions, newest first.
      summary: List transactions
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionPreview'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/transactions/{transaction_id}:
    get:
      operationId: transactions_retrieve
      description: Retrieve a specific transaction.
      summary: Get transaction details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Transaction ID
        required: true
      - in: path
        name: transaction_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedTransactionDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/transactions/search:
    post:
      operationId: transactions_search
      description: Retrieve transactions matching a filter tree passed in the request
        body. POST carries the tree; this is a read in every other respect — it honours
        Read-At-Least and emits no write version. Served from the Elasticsearch projection.
      summary: Search transactions with filters
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterTransactionsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FilterTransactionsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FilterTransactionsRequest'
        required: true
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionSearchResult'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/wallets:
    get:
      operationId: wallets_list
      description: 'Retrieve a page of your wallets: favorites first, then newest
        first. Closed wallets are excluded.'
      summary: List wallets
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWalletPreview'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/wallets/{wallet_id}:
    get:
      operationId: wallets_retrieve
      description: Retrieve a specific wallet, including its inflow and outflow over
        the requested `period` and a page of its recent transactions. `limit` and
        `cursor` paginate `recent`, reported under `meta.recent`; the window is echoed
        in `meta.period`. A closed wallet still resolves by id — DELETE removes it
        from lists and search, not from existence.
      summary: Get wallet details
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Wallet ID
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      - in: query
        name: period
        schema:
          type: string
          enum:
          - all_time
          - last_month
          - last_week
          - last_year
          default: last_month
        description: Window for the `period` inflow/outflow figures. Every value is
          a CALENDAR window resolved in your timezone preference, not a rolling count
          of days.
      - in: path
        name: wallet_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedWalletDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/wallets/search:
    post:
      operationId: wallets_search
      description: Retrieve wallets matching a filter tree passed in the request body.
        POST carries the tree; this is a read in every other respect — it honours
        Read-At-Least and emits no write version. Served from the Elasticsearch projection.
      summary: Search wallets with filters
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterWalletsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FilterWalletsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FilterWalletsRequest'
        required: true
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWalletSearchResult'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/webhooks:
    get:
      operationId: webhooks_list
      description: Retrieve a page of your webhook endpoints, newest first.
      summary: List webhooks
      parameters:
      - in: query
