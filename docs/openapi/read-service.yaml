  /api/v1/accounts:
    get:
      operationId: accounts_list
      description: |-
        Retrieve a page of your double-entry chart of accounts, newest first. These accounts are derived by the backend from your transactions; they are not created or edited directly.

        `group` narrows the page but never reorders it — assets do not lead liabilities. `meta.groups` reports every group regardless, so the tab labels do not change when a tab is selected.
      summary: List ledger accounts
      parameters:
      - in: query
        name: currency
        schema:
          type: string
          default: USD
          minLength: 1
        description: The currency `lowbar` is expressed in. Unknown codes 422.
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: query
        name: group
        schema:
          enum:
          - all
          - assets
          - liabilities
          - equity
          type: string
          default: all
          minLength: 1
        description: |-
          Narrow the chart to one group. `all` is the default.

          * `all` - all
          * `assets` - assets
          * `liabilities` - liabilities
          * `equity` - equity
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      - in: query
        name: lowbar
        schema:
          type: string
          default: '0'
          minLength: 1
        description: Hide accounts whose balance is smaller than this in MAGNITUDE,
          so a threshold does not silently drop every liability. Money Shape grammar,
          validated against `currency`'s scale.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountPreview'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/accounts/{account_id}:
    get:
      operationId: accounts_retrieve
      description: |-
        Retrieve one ledger account with a page of the postings dispatched into it, newest first. `limit` and `cursor` paginate `history`, reported under `meta.history`.

        `money` is the account's balance in its BOOK currency; each history entry carries the currency of the transaction that produced it, which may differ.
      summary: Get account details
      parameters:
      - in: path
        name: account_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Account ID
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedAccountDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/actions:
    get:
      operationId: actions_list
      description: |+
        Things you must DECIDE about, most urgent first.

        Ordered `severity DESC, created_at DESC, id DESC`. Unlike the notification feed this IS a queue to be worked through, so a critical action outranks an older informational one.

      summary: List the needs-action queue
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - critical
          - info
          - warning
        description: Restrict to one severity. Absent means all of them.
      - in: query
        name: source
        schema:
          type: string
          enum:
          - assistant
          - scheduler
        description: Restrict to one producer. Absent means both.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - dismissed
          - expired
          - pending
          - resolved
        description: Which queue state to list. Defaults to `pending`.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActionPreview'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/analytics/balance-history:
    get:
      operationId: analytics_balance_history_retrieve
      description: Balances measured from each wallet's opening balance, transfers
        included, sampled at `points` evenly spaced instants from `since` to `until`.
      summary: Get evenly spaced balance samples per wallet and in total
      parameters:
      - in: query
        name: currency
        schema:
          type: string
        description: ISO-4217 target currency for every amount. Defaults to the user's
          main currency.
      - in: query
        name: points
        schema:
          type: integer
        description: How many samples to take. 2..120, default 40.
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: Inclusive start of the window. Defaults to `until` minus 30 days.
      - in: query
        name: timezone
        schema:
          type: string
        description: IANA zone that cuts days, ISO weeks, months and hours of day.
          Defaults to UTC.
      - in: query
        name: until
        schema:
          type: string
          format: date-time
        description: Exclusive end of the window. Defaults to now. At most 5 years
          after `since`.
      - in: query
        name: wallet_id
        schema:
          type: string
        description: Comma-joined wallet ids. Defaults to every open wallet.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedAnalyticsBalanceHistory'
          description: ''
        '409':
          content:
            application/json:
