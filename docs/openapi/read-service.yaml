            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /health/live:
    get:
      operationId: health_live_retrieve
      description: |-
        Liveness probe: always 200 while the ASGI worker can answer at all.
        Kubernetes treats failures here as fatal and restarts the pod, so this
        endpoint deliberately performs no dependency checks.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDegradedResponse'
          description: ''
  /health/ready:
    get:
      operationId: health_ready_retrieve
      description: |-
        Readiness probe: 200 when Postgres, Redis and Elasticsearch are all
        reachable, 503 otherwise. Kong/Kubernetes use this signal to gate traffic;
        failing here does not restart the pod (that's liveness's job).
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthChecksResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDegradedResponse'
          description: ''
  /health/startup:
    get:
      operationId: health_startup_retrieve
      description: |-
        Startup probe: 200 once the database is reachable and all migrations
        are applied. Kubernetes holds liveness/readiness checks until this
        succeeds, giving slow boots room without being killed.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthChecksResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDegradedResponse'
          description: ''
components:
  schemas:
    AccountDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        group:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        money:
          $ref: '#/components/schemas/Money'
        history:
          type: array
          items:
            $ref: '#/components/schemas/AccountHistoryEntry'
      required:
      - created_at
      - group
      - history
      - id
      - money
      - name
      - updated_at
    AccountHistoryEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Stable anchor for the history cursor. The target's examples
            omit it, but a keyset-paginated collection needs one.
        title:
          type: string
        debit:
          type: boolean
          description: True debits the account, false credits it.
        created_at:
          type: string
          format: date-time
        source_transaction:
          type: string
          format: uuid
        icon:
          type: string
          description: Display glyph, decoration only.
        money:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: The leg at the TRANSACTION's currency, which is not necessarily
            the book currency the account's balance is summed in.
      required:
      - created_at
      - debit
      - icon
      - id
      - money
      - source_transaction
      - title
    AccountPreview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        group:
          type: string
          description: assets, liabilities or equity; blank when ungrouped
        name:
          type: string
        money:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: The account's balance in the BOOK currency it is summed in,
            not in the currency of the transactions behind it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - group
      - id
      - money
      - name
      - updated_at
    ActionMoney:
      type: object
      properties:
        amount:
          type: string
        currency:
          type: string
      required:
      - amount
      - currency
    ActionPreview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/SourceEnum'
        kind:
          type: string
          description: An OPEN vocabulary. Use it to pick an icon and fall back to
            a generic one for values you do not know. Never derive labels, button
            counts or behaviour from it — that is what `resolutions` is.
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        title:
          type: string
        body:
          type: string
        subject:
          allOf:
          - $ref: '#/components/schemas/ActionSubject'
          nullable: true
        money:
          allOf:
          - $ref: '#/components/schemas/ActionMoney'
          nullable: true
          description: In the currency the action concerns. NOT the reporting currency.
        group_key:
          type: string
          nullable: true
          description: Collapses recurring conditions onto one row. Null when it does
            not recur.
        occurrences:
          type: integer
          description: 1 for a non-recurring action, never 0.
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolutions:
          type: array
          items:
            $ref: '#/components/schemas/ActionResolution'
          description: Never empty while pending; always empty once answered.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
      required:
      - body
      - created_at
      - deleted_at
      - expires_at
      - group_key
      - id
      - kind
      - last_seen_at
      - money
      - occurrences
      - resolutions
      - resolved_at
      - severity
      - source
      - status
      - subject
      - title
      - updated_at
    ActionResolution:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        intent:
          allOf:
          - $ref: '#/components/schemas/IntentEnum'
          description: |-
            A rendering hint, not behaviour. A client may style all of them identically.

            * `primary` - primary
            * `secondary` - secondary
            * `danger` - danger
        applies:
          type: boolean
          description: Whether choosing it changes OTHER resources.
      required:
      - applies
      - id
      - intent
      - label
    ActionSubject:
      type: object
      properties:
        type:
          type: string
          description: A resource name in this API.
        id:
          type: string
      required:
      - id
      - type
    Automation:
      type: object
      description: 'One rule as the list returns it: the complete resource, not a
        preview.'
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
        enabled:
          type: boolean
        trigger:
          $ref: '#/components/schemas/AutomationTrigger'
        effects:
          type: array
          items:
            $ref: '#/components/schemas/AutomationEffect'
        last_run_at:
          type: string
          format: date-time
          nullable: true
        runs:
          type: integer
          description: MATCHES that applied effects, not evaluations. A rule checked
            a thousand times that never matched reports 0.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - deleted_at
      - effects
      - enabled
      - icon
      - id
      - last_run_at
      - name
      - runs
      - trigger
      - updated_at
    AutomationDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
        enabled:
          type: boolean
        trigger:
          $ref: '#/components/schemas/AutomationTrigger'
        effects:
          type: array
          items:
            $ref: '#/components/schemas/AutomationEffect'
        last_run_at:
          type: string
          format: date-time
          nullable: true
        runs:
          type: integer
          description: MATCHES that applied effects, not evaluations. A rule checked
            a thousand times that never matched reports 0.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - deleted_at
      - effects
      - enabled
      - icon
      - id
      - last_run_at
      - name
      - runs
      - trigger
      - updated_at
    AutomationEffect:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AutomationEffectTypeEnum'
        params:
          type: object
          additionalProperties: {}
      required:
      - params
      - type
    AutomationEffectTypeEnum:
      enum:
      - set_category
      - notify
      - raise_action
      - transfer
      type: string
      description: |-
        * `set_category` - set_category
        * `notify` - notify
        * `raise_action` - raise_action
        * `transfer` - transfer
    AutomationTrigger:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AutomationTriggerTypeEnum'
        event:
          nullable: true
          description: |-
            Null unless `type` is `event`. Always present.

            * `transaction.created` - transaction.created
            * `transaction.updated` - transaction.updated
          oneOf:
          - $ref: '#/components/schemas/EventEnum'
          - $ref: '#/components/schemas/NullEnum'
        schedule:
          nullable: true
          description: |-
            Null unless `type` is `schedule`. Always present.

            * `daily` - daily
            * `weekly` - weekly
            * `monthly` - monthly
          oneOf:
          - $ref: '#/components/schemas/ScheduleEnum'
          - $ref: '#/components/schemas/NullEnum'
        filter_body:
          type: object
          additionalProperties: {}
          nullable: true
          description: The same filter tree the `/search` endpoints take. Null means
            the rule is unconditional.
      required:
      - event
      - filter_body
      - schedule
      - type
    AutomationTriggerTypeEnum:
      enum:
      - event
      - schedule
      type: string
      description: |-
        * `event` - event
        * `schedule` - schedule
    BalanceSheet:
      type: object
      properties:
        assets:
          $ref: '#/components/schemas/Money'
        liabilities:
          $ref: '#/components/schemas/Money'
        equity:
          $ref: '#/components/schemas/Money'
        balanced:
          type: boolean
          description: True when `assets == liabilities + equity` AND no transaction
            was posted with legs that disagreed. A diagnostic, never an error.
        comments:
          type: string
          nullable: true
          description: Why the sheet does not balance. Null when it does.
      required:
      - assets
      - balanced
      - comments
      - equity
      - liabilities
    CashFlow:
      type: object
      properties:
        inflow:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: 'A positive magnitude: what arrived.'
        outflow:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: 'A positive magnitude: what left.'
        total_net:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: '`inflow - outflow`. Negative when more left than arrived.'
        savings_rate:
          type: number
          format: double
          nullable: true
          description: The share of income that was not spent, as a percentage — a
            bare number, not money. Null when nothing came in, where the rate is undefined
            rather than zero.
      required:
      - inflow
      - outflow
      - savings_rate
      - total_net
    ChartMeta:
      type: object
      properties:
        limit:
          type: integer
          nullable: true
          description: Effective page size. Null on non-paginated endpoints.
        total:
          type: integer
          description: Total items matching the request, ignoring pagination.
        next_cursor:
          type: string
          nullable: true
          description: Opaque token for the page after this one. Null when exhausted.
        prev_cursor:
          type: string
          nullable: true
          description: Opaque token for the page before this one. Null on the first
            page.
        cached:
          type: boolean
          description: True when the payload was served from cache rather than rebuilt.
        lowbar:
          type: string
          description: The threshold actually applied, at `currency`'s scale.
        currency:
          type: string
          description: The currency `lowbar` was read in.
        group:
          type: string
          description: The group filter actually applied.
        groups:
          type: object
          additionalProperties:
            type: integer
          description: Per-group counts for the tab labels. NOT narrowed by `group`
            — it always describes every group — but `lowbar` does apply, so a count
            matches what selecting that tab returns.
      required:
      - currency
      - group
      - groups
      - limit
      - lowbar
      - next_cursor
      - prev_cursor
      - total
    CollectionMeta:
      type: object
      properties:
        limit:
          type: integer
          nullable: true
          description: Effective page size. Null on non-paginated endpoints.
        total:
          type: integer
          description: Total items matching the request, ignoring pagination.
        next_cursor:
          type: string
          nullable: true
          description: Opaque token for the page after this one. Null when exhausted.
        prev_cursor:
          type: string
          nullable: true
          description: Opaque token for the page before this one. Null on the first
            page.
        cached:
          type: boolean
          description: True when the payload was served from cache rather than rebuilt.
      required:
      - limit
      - next_cursor
      - prev_cursor
      - total
    Conversion:
      type: object
      properties:
        to:
          $ref: '#/components/schemas/Money'
        rate:
          type: string
          description: 'The multiplier applied, as a decimal string. NOT money: no
            currency, no scale padding, up to 12 fraction digits. `to` is the authoritative
            figure — render that rather than multiplying this.'
        from:
          $ref: '#/components/schemas/Money'
      required:
      - from
      - rate
      - to
    ConversionMeta:
      type: object
      properties:
        fetched_at:
          type: string
          format: date-time
          description: When the FEED published the rate, not when the conversion ran.
      required:
      - fetched_at
    Currency:
      type: object
      properties:
        code:
          type: string
          description: ISO-4217 alphabetic code.
        symbol:
          type: string
          description: Display symbol. Empty when the currency has no established
            one.
        name:
          type: string
        decimals:
          type: integer
          description: Fraction digits every amount in this currency is rendered at.
      required:
      - code
      - decimals
      - name
      - symbol
    CurrencyCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Currency'
        meta:
          $ref: '#/components/schemas/CollectionMeta'
      required:
      - data
      - meta
    CurrencyRates:
      type: object
      properties:
        base:
          type: string
          description: The denominator of every rate in the map, not a converted-from
            code.
        rates:
          type: object
