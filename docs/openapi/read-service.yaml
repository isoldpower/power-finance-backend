  /api/v1/webhooks/{webhook_id}/events:
    get:
      operationId: webhooks_subscriptions_list
      description: 'Retrieve every event type the webhook is subscribed to. The set
        is bounded by the event catalogue, so this endpoint is not paginated: it reports
        `limit: null` with both cursors null and always returns everything.'
      summary: List webhook event subscriptions
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Webhook ID
        required: true
      - in: path
