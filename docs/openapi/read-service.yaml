  /api/v1/webhooks/event-types:
    get:
      operationId: webhooks_event_types_list
      description: 'The catalog a subscription''s `event` must name. Small, the same
        for every caller and always returned complete, so it is NOT paginated: `meta.limit`
        and both cursors are null. Populate the subscription UI from here rather than
        from a list in client code — adding an event type is additive and needs no
        client release.'
      summary: List subscribable webhook event types
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
