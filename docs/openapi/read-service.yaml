        description: Comma-joined transaction category ids. `__none__` selects uncategorised
          rows.
      - in: query
        name: currency
        schema:
          type: string
        description: ISO-4217 target currency for every amount. Defaults to the user's
          main currency.
      - in: query
        name: limit
        schema:
          type: integer
        description: How many rows to return. 1..50, default 20.
      - in: query
        name: name
        schema:
          type: string
        description: Exact counterparty, trimmed and compared case-insensitively.
      - in: query
        name: order
        schema:
          type: string
          enum:
          - amount_desc
          - created_desc
        description: Defaults to `amount_desc`.
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: Inclusive start of the window. Defaults to `until` minus 30 days.
      - in: query
        name: timezone
        schema:
          type: string
        description: IANA zone that cuts days, ISO weeks, months and hours of day.
          Defaults to UTC.
      - in: query
        name: type
        schema:
          type: string
          enum:
          - expense
          - income
        description: Ledger side. Both when omitted.
      - in: query
        name: until
        schema:
          type: string
          format: date-time
        description: Exclusive end of the window. Defaults to now. At most 5 years
          after `since`.
      - in: query
        name: wallet_id
        schema:
          type: string
        description: Comma-joined wallet ids. Defaults to every open wallet.
