                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/wallets/{wallet_id}:
    get:
      operationId: wallets_retrieve
      description: Retrieve a specific wallet, including its inflow and outflow over
        the requested `period` and a page of its recent transactions. `limit` and
        `cursor` paginate `recent`, reported under `meta.recent`; the window is echoed
        in `meta.period`. A closed wallet still resolves by id — DELETE removes it
        from lists and search, not from existence.
      summary: Get wallet details
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Wallet ID
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      - in: query
        name: period
        schema:
          type: string
          enum:
          - all_time
          - last_month
          - last_week
          - last_year
          default: last_month
        description: 'Window for the `period` inflow/outflow figures. Every value
          is a ROLLING window of whole days ending with today, resolved in your timezone
          preference: `last_week` is the last 7 days, `last_month` the last 30, `last_year`
          the last 365. Today is included.'
      - in: path
        name: wallet_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedWalletDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/wallets/search:
    post:
      operationId: wallets_search
      description: Retrieve wallets matching a filter tree passed in the request body.
        POST carries the tree; this is a read in every other respect — it honours
        Read-At-Least and emits no write version. Served from the Elasticsearch projection.
      summary: Search wallets with filters
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterWalletsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FilterWalletsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FilterWalletsRequest'
        required: true
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWalletSearchResult'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/webhooks:
    get:
      operationId: webhooks_list
      description: Retrieve a page of your webhook endpoints, newest first.
      summary: List webhooks
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from a previous response's `meta.next_cursor` or
          `meta.prev_cursor`. Absent returns the first page. Direction is encoded
          in the cursor itself.
      - in: query
        name: enabled
        schema:
          type: boolean
        description: Restrict to enabled or disabled endpoints. ABSENT means both
          — it is a tristate, not a boolean defaulting to either value.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Defaults to 25, clamped to 1..100 — out-of-range values
          are clamped rather than rejected, so `meta.limit` reports what was applied.
      tags:
      - api
      security:
      - clerkBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWebhookPreview'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/webhooks/{webhook_id}:
    get:
      operationId: webhooks_retrieve
      description: Retrieve a specific webhook endpoint.
      summary: Get webhook details
      parameters:
      - in: path
        name: id
