[project]
name = "power-finance-cqrs"
version = "0.0.0"
description = "Power Finance — CQRS architecture monorepo (Write, Read, Push services + shared Python libraries + infrastructure)."
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "services/write-service",
    "services/read-service",
    "libraries/auth-py",
    "libraries/correlation-py",
    "libraries/events-py",
    "libraries/kafka-client-py",
    "libraries/kafka-messages-proto",
    "libraries/observability-py",
    "libraries/read-at-least-py",
    "libraries/saga-pattern-py",
]

# Note: services/push-service is a Go module and is intentionally excluded
# from the uv workspace. It is managed by `go mod` independently.

[dependency-groups]
dev = [
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
    # protoc + Python plugin, used by libraries/kafka-messages-proto's
    # codegen script. Workspace-level dev dep so a single `uv sync` makes
    # `python -m grpc_tools.protoc` available in .venv.
    "grpcio-tools>=1.66,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# force-exclude so generated protobuf bindings are skipped even when a runner
# (pre-commit, editor-on-save) passes the file path explicitly. Without it,
# ruff strips the side-effectful `timestamp_pb2` import from *_pb2.py as
# "unused", which breaks descriptor-pool loading at runtime.
force-exclude = true
extend-exclude = [
    "**/migrations/**",
    "**/generated/**",
    ".venv",
    "old-structure",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
explicit_package_bases = true
namespace_packages = true
exclude = [
    "/migrations/",
    "/tests/",
    "/generated/",
    ".venv",
    "manage\\.py$",
    "services/read-service/",
    "old-structure/",
]
