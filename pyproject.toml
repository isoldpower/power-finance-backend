# See README.md → "Tooling notes"
[project]
name = "power-finance-cqrs"
version = "0.0.0"
description = "Power Finance — CQRS architecture monorepo (Write, Read, Push services + shared Python libraries + infrastructure)."
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "services/write-service",
    "services/read-service",
    "libraries/auth-py",
    "libraries/correlation-py",
    "libraries/events-py",
    "libraries/kafka-client-py",
    "libraries/kafka-consumer-py",
    "libraries/kafka-messages-proto",
    "libraries/observability-py",
    "libraries/read-at-least-py",
    "libraries/saga-pattern-py",
    "services/ai-service",
]

# immudb-py 1.5.0 ships broken metadata: it declares a dependency on the Hive
# "google-api" package (and "appier"), which installs a non-namespace
# google/__init__.py that shadows google.protobuf and crashes on import. immudb
# never imports either, so we override its metadata to drop them.
[[tool.uv.dependency-metadata]]
name = "immudb-py"
version = "1.5.0"
requires-dist = [
    "cachetools",
    "certifi",
    "charset-normalizer",
    "ecdsa",
    "google-api-core",
    "google-api-python-client",
    "google-auth",
    "google-auth-httplib2",
    "googleapis-common-protos",
    "grpcio",
    "httplib2",
    "idna",
    "proto-plus",
    "protobuf",
    "pyasn1",
    "pyasn1-modules",
    "pyparsing",
    "requests",
    "rsa",
    "six",
    "uritemplate",
    "urllib3",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
    "grpcio-tools>=1.66,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
force-exclude = true
extend-exclude = [
    "**/migrations/**",
    # Alembic's equivalent of a migrations directory.
    "**/alembic/versions/**",
    # Reference copies of removed work; not on the import path.
    ".phase-5-backup",
    "**/generated/**",
    ".venv",
    "old-structure",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"**/__tests__/**" = ["B"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
# pydantic-settings fills every field from the environment, so a field with no
# default is not a required constructor argument. Only pydantic's own plugin
# knows that; without it every `Settings()` call needs a type: ignore.
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
explicit_package_bases = true
namespace_packages = true
exclude = [
    "/migrations/",
    "/alembic/versions/",
    "\\.phase-5-backup/",
    "/__tests__/",
    "/generated/",
    ".venv",
    "manage\\.py$",
    "fakes\\.py$",
    "old-structure/",
]
