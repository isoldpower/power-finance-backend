# See README.md → "Shared dev environment"
x-live-source-env: &live-source-env
  PYTHONDONTWRITEBYTECODE: "1"
  WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-false}

services:
  sbx-write-service:
    environment:
      <<: *live-source-env
    volumes:
      - ./services/write-service:/app/services/write-service
    command:
      - uvicorn
      - write_service.asgi:application
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/services/write-service

  sbx-write-inbound-notifications-consumer:
    environment:
      <<: *live-source-env
    volumes:
      - ./services/write-service:/app/services/write-service

  sbx-write-fraud-alerts-consumer:
    environment:
      <<: *live-source-env
    volumes:
      - ./services/write-service:/app/services/write-service

  sbx-write-automation-engine:
    environment:
      <<: *live-source-env
    volumes:
      - ./services/write-service:/app/services/write-service

  sbx-write-automation-scheduler:
    environment:
      <<: *live-source-env
    volumes:
      - ./services/write-service:/app/services/write-service

  sbx-write-action-expiry-sweeper:
    environment:
      <<: *live-source-env
    volumes:
      - ./services/write-service:/app/services/write-service

  sbx-read-service:
    environment:
      <<: *live-source-env
    volumes:
      - ./services/read-service:/app/services/read-service
    command:
      - uvicorn
      - read_service.asgi:application
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/services/read-service

  sbx-read-write-consumer:
    environment:
      <<: *live-source-env
    volumes:
      - ./services/read-service:/app/services/read-service

  sbx-ai-service:
    environment:
      <<: *live-source-env
    volumes:
      - ./services/ai-service:/app/services/ai-service
    command:
      - uvicorn
      - ai_service.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/services/ai-service

  sbx-ai-dispatcher:
    environment:
      <<: *live-source-env
    volumes:
      - ./services/ai-service:/app/services/ai-service
