# Custom postgresql.conf for write-side Postgres.
#
# Loaded via `-c config_file=/etc/postgresql/postgresql.conf` in compose.yaml
# (mounted read-only from this file). The `include_if_exists` line below
# pulls in the image-generated config from the data directory first; every
# setting that follows then overrides it. That way we keep the upstream +
# docker-image defaults (listen_addresses, log_statement, etc.) and only
# encode the project-specific tweaks here.

include_if_exists = '/var/lib/postgresql/data/pgdata/postgresql.conf'

# -----------------------------------------------------------------------------
# Logical replication — required by the Debezium outbox publisher tailing
# the WAL. Harmless when Debezium is not attached.
#
# max_slot_wal_keep_size bounds the WAL that an idle/stalled replication
# slot is allowed to pin on disk. Without it, a stopped Debezium consumer
# silently pins WAL forever and fills pg_wal until the volume is full and
# the database refuses writes. With it, Postgres invalidates the slot
# once the threshold is crossed — Debezium then needs a re-snapshot, but
# the database stays writable. Dev value below; production sizes this to
# the longest tolerable Debezium outage.
# -----------------------------------------------------------------------------

wal_level = logical
max_wal_senders = 4
max_replication_slots = 4
max_slot_wal_keep_size = '2GB'
