# Shared Kafka broker (KRaft, single-node). Lives in its own compose file
# so each service stack can `include:` it and remain standalone-runnable,
# while the root compose pulls it in transitively via the service includes.
# Topics live alongside in topics.yml.

volumes:
  kafka_data:

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    environment:
      # KRaft (no Zookeeper). Single-node cluster: broker + controller in
      # the same process. Fine for dev; production uses an odd-numbered
      # controller quorum on separate nodes.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 1 broker → replication factor and ISR must collapse to 1 for the
      # Connect internal topics, otherwise Connect refuses to start.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Stable cluster ID across restarts — required by KRaft and must be
      # a 22-char base64 (no padding) UUID. Generated once and pinned.
      CLUSTER_ID: "MkU3OEEzZWMyL1A1U0RFcw"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
