# See ./README.md → "Kong gateway"
_format_version: "3.0"
_transform: true

services:
  - name: write-service
    host: write-service
    port: 8000
    protocol: http
    connect_timeout: 5000
    write_timeout: 30000
    read_timeout: 30000
    # There is ONE public surface, /api/v1. The read/write split lives here, in
    # the router, rather than in the paths a client types: reads and writes of
    # the same resource share a URL and differ only by method.
    routes:
      - name: write-api-v1
        paths:
          - /api/v1
        strip_path: false
        preserve_host: false
        methods: [POST, PUT, PATCH, DELETE, OPTIONS]
      - name: write-api-v1-read
        paths:
          - /api/v1/fallback-reads
        strip_path: false
        preserve_host: false
        methods: [GET, OPTIONS]
    plugins:
      - name: clerk-jwt
        config:
          issuer_url: "{vault://env/clerk-issuer-url}"
          redis_host: gateway-redis
          redis_port: 6379
          redis_database: 0
          redis_timeout_ms: 100
          redis_key_prefix: "clerk:jwks:"
      - name: write-ral-version
        config:
          hmac_secret: "{vault://env/read-at-least-hmac-secret}"
          write_version_header: "X-Write-Version"
          redis_host: gateway-redis
          redis_port: 6379
          redis_database: 0
          redis_timeout_ms: 100
          redis_key_prefix: "ral:user:"
          redis_ttl_seconds: 604800
      - name: rate-limiting
        config:
          minute: 200
          hour: 5000
          policy: redis
          redis_host: gateway-redis
          redis_port: 6379
          limit_by: ip
          fault_tolerant: true
          hide_client_headers: true
      - name: user-tier-rate-limit
        config:
          per_minute: 60
          per_hour: 1000
          redis_host: gateway-redis
          redis_port: 6379
          redis_database: 0
          redis_timeout_ms: 1000
          redis_key_prefix: "rl:user:"

  - name: read-service
    host: read-service
    port: 8000
    protocol: http
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: read-api-v1
        paths:
          - /api/v1
        strip_path: false
        preserve_host: false
        methods: [GET, OPTIONS]
      # The /search endpoints are READS that arrive as POST, because a filter
      # tree does not survive a query string. Their longer path outranks the
      # write route's bare /api/v1 prefix, which is what keeps them on the read
      # side without inventing a separate URL space for them.
      - name: read-api-v1-search
        paths:
          - /api/v1/wallets/search
          - /api/v1/transactions/search
          - /api/v1/webhooks/search
        strip_path: false
        preserve_host: false
        methods: [POST, OPTIONS]
    plugins:
      - name: clerk-jwt
        config:
          issuer_url: "{vault://env/clerk-issuer-url}"
          redis_host: gateway-redis
          redis_port: 6379
          redis_database: 0
          redis_timeout_ms: 100
          redis_key_prefix: "clerk:jwks:"
      - name: read-at-least
        config:
          hmac_secret: "{vault://env/read-at-least-hmac-secret}"
          redis_host: gateway-redis
          redis_port: 6379
          redis_database: 0
          redis_timeout_ms: 100
          redis_key_prefix: "ral:user:"
      - name: read-fallback
        config:
          read_service_url: "http://read-service:8000"
          write_service_url: "http://write-service:8000"
          read_path_prefix: "/api/v1"
          fallback_path_prefix: "/api/v1/fallback-reads"
          fallback_status: 507
          read_timeout_ms: 10000
          fallback_timeout_ms: 30000
      - name: rate-limiting
        config:
          minute: 1200
          hour: 30000
          policy: redis
          redis_host: gateway-redis
          redis_port: 6379
          limit_by: ip
          fault_tolerant: true
          hide_client_headers: true
      - name: user-tier-rate-limit
        config:
          per_minute: 600
          per_hour: 20000
          redis_host: gateway-redis
          redis_port: 6379
          redis_database: 0
          redis_timeout_ms: 1000
          redis_key_prefix: "rl:user:"

  - name: push-service
    host: push-service
    port: 8001
    protocol: http
    connect_timeout: 5000
    write_timeout: 3600000
    read_timeout: 3600000
    routes:
      # Longer than the read route's /api/v1 prefix, so the stream reaches
      # push-service while every other GET under /api/v1 goes to read-service.
      - name: notifications-stream
        paths:
          - /api/v1/notifications/stream
        strip_path: false
        preserve_host: false
        methods: [GET, OPTIONS]
    plugins:
      - name: clerk-jwt
        config:
          issuer_url: "{vault://env/clerk-issuer-url}"
          redis_host: gateway-redis
          redis_port: 6379
          redis_database: 0
          redis_timeout_ms: 100
          redis_key_prefix: "clerk:jwks:"

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true

  - name: cors
    config:
      origins:
        - "*"
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Correlation-ID
        - Read-At-Least
        - Idempotency-Key
      exposed_headers:
        - X-Correlation-ID
        - X-Write-Version
        - Idempotent-Replayed
        - Retry-After
        - X-RateLimit-Limit-Minute
        - X-RateLimit-Remaining-Minute
        - X-RateLimit-Limit-Hour
        - X-RateLimit-Remaining-Hour
      credentials: false
      max_age: 3600
