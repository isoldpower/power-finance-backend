_format_version: "3.0"
_transform: true

# -----------------------------------------------------------------------------
# Upstream services
#
# Kong proxies requests to these by their docker-compose service names on the
# internal network. read-service and push-service are stubs — declared so the
# routing surface is stable, but their containers aren't up yet.
# -----------------------------------------------------------------------------

services:
  - name: write-service
    host: write-service
    port: 8000
    protocol: http
    connect_timeout: 5000
    write_timeout: 30000
    read_timeout: 30000
    routes:
      - name: write-api-v1
        paths:
          - /api/v1
        strip_path: false
        preserve_host: false
        methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    plugins:
      - name: clerk-jwt
        config:
          issuer_url: "{vault://env/clerk-issuer-url}"
      # Tier 1 — IP floor. Applies to every request (anonymous and
      # authenticated). Generous enough to survive shared IPs (NAT,
      # corporate, mobile carriers) where many users share an egress.
      # Runs before clerk-jwt thanks to clerk-jwt's lowered priority.
      - name: rate-limiting
        config:
          minute: 200
          hour: 5000
          policy: redis
          redis_host: gateway-redis
          redis_port: 6379
          limit_by: ip
          fault_tolerant: true
          # IP floor is enforced but invisible. Headers come from the
          # user-tier plugin so the client sees one set of numbers that
          # actually match the limit binding their traffic.
          hide_client_headers: true
      # Tier 2 — per-user ceiling for authenticated callers. Stricter than
      # the IP floor; for normal traffic this is what actually bites.
      - name: user-tier-rate-limit
        config:
          per_minute: 60
          per_hour: 1000

  - name: read-service
    host: read-service
    port: 8000
    protocol: http
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: read-api-v1
        paths:
          - /api/v1/reads
        strip_path: false
        preserve_host: false
        methods: [GET, OPTIONS]
    plugins:
      - name: clerk-jwt
        config:
          issuer_url: "{vault://env/clerk-issuer-url}"
      # read-at-least only matters on the read path: it enforces the
      # consistency contract between client and Read Service.
      - name: read-at-least
        config:
          hmac_secret: "{vault://env/read-at-least-hmac-secret}"
          offset_claim_name: last_write_offset
      # Tier 1 — IP floor on the read path. Reads are cheap; this cap is
      # mostly here as anti-flood for unauthenticated probes.
      - name: rate-limiting
        config:
          minute: 1200
          hour: 30000
          policy: redis
          redis_host: gateway-redis
          redis_port: 6379
          limit_by: ip
          fault_tolerant: true
          # IP floor is enforced but invisible. Headers come from the
          # user-tier plugin so the client sees one set of numbers that
          # actually match the limit binding their traffic.
          hide_client_headers: true
      # Tier 2 — per-user ceiling on reads. Tuned wide because read UIs
      # are pagination-heavy and re-render on every focus change.
      - name: user-tier-rate-limit
        config:
          per_minute: 600
          per_hour: 20000

  - name: push-service
    host: push-service
    port: 8000
    protocol: http
    connect_timeout: 5000
    # Long timeouts — SSE connections are long-lived. Buffering disabled at
    # the nginx layer via KONG_NGINX_PROXY_PROXY_BUFFERING=off in compose.
    write_timeout: 3600000
    read_timeout: 3600000
    routes:
      - name: events-sse
        paths:
          - /events
        strip_path: false
        preserve_host: false
        methods: [GET, OPTIONS]
    plugins:
      - name: clerk-jwt
        config:
          issuer_url: "{vault://env/clerk-issuer-url}"
      # No rate-limiting on /events: SSE is connection-bound, not request-
      # bound, and a per-request counter would fire after the first event.
      # Concurrent-connection limits belong on the Push Service itself.

# -----------------------------------------------------------------------------
# Global plugins — cross-cutting concerns applied to every route.
# -----------------------------------------------------------------------------

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true

  - name: cors
    config:
      origins:
        - "*"
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Correlation-ID
        - Read-At-Least
        - Idempotency-Key
      exposed_headers:
        - X-Correlation-ID
        - X-Write-Version
        - Idempotent-Replayed
      credentials: false
      max_age: 3600
