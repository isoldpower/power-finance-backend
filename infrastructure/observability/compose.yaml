# See ../README.md → "Tracing"
volumes:
  jaeger_data:

services:
  jaeger-storage-init:
    image: alpine:3.20
    restart: "no"
    command:
      - sh
      - -c
      - mkdir -p /badger/key /badger/data && chown -R 10001:0 /badger
    volumes:
      - jaeger_data:/badger

  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION:-2.22.0}
    restart: unless-stopped
    command: ["--config", "/etc/jaeger/config.yaml"]
    environment:
      JAEGER_SPAN_TTL: ${JAEGER_SPAN_TTL:-72h}
      JAEGER_LOG_LEVEL: ${JAEGER_LOG_LEVEL:-info}
      DEMO_SESSIONS_KAFKA_BROKERS: ${DEMO_SESSIONS_KAFKA_BROKERS:-kafka:9092}
      DEMO_SESSIONS_KAFKA_TOPIC: ${DEMO_SESSIONS_KAFKA_TOPIC:-telemetry.demo-spans}
    volumes:
      - jaeger_data:/badger
      - ./jaeger-config.yaml:/etc/jaeger/config.yaml:ro
    depends_on:
      jaeger-storage-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
        required: false
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    expose:
      - "4317"
      - "4318"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/status"]
      interval: 15s
      timeout: 5s
      retries: 5
