[project]
name = "read-service"
version = "0.0.0"
description = "Power Finance — Read Service (CQRS read side, Postgres read schema + Elasticsearch + Redis caches + cache invalidator)."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
    "psycopg[binary,pool]>=3.3,<4.0",
    "redis>=7.0,<8.0",
    "elasticsearch>=8.13,<9.0",
    "drf-spectacular>=0.29,<0.30",
    "django-environ>=0.13,<0.14",
    "django-cors-headers>=4.9,<5.0",
    "pydantic>=2.12,<3.0",
    "aiokafka>=0.11,<0.13",
    "kafka-client-py",
    "saga-pattern-py",
    "kafka-messages-proto",
]

[tool.uv.sources]
kafka-client-py = { workspace = true }
saga-pattern-py = { workspace = true }
kafka-messages-proto = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["read_service", "data_read_core", "background_workers"]
