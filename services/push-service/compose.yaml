include:
  - ../../infrastructure/kafka/compose.yaml

services:
  push-service:
    build:
      context: ../..
      dockerfile: services/push-service/Dockerfile
    image: power-finance/push-service:dev
    restart: unless-stopped
    environment:
      PUSH_SERVICE_HOST: 0.0.0.0
      PUSH_SERVICE_PORT: "8001"
      PUSH_SERVICE_HEARTBEAT_INTERVAL_SECONDS: ${PUSH_SERVICE_HEARTBEAT_INTERVAL_SECONDS:-15}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_OUTBOX_TOPIC: ${KAFKA_OUTBOX_TOPIC:-events.async}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8001/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
