[project]
name = "ai-service"
version = "0.1.0"
description = "Power Finance — AI Service (FastAPI assistant + the posting dispatcher worker)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "websockets>=16.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary,pool]>=3.3,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "aiokafka>=0.11,<0.13",
    "kafka-client-py",
    "kafka-consumer-py",
    "kafka-messages-proto",
    "correlation-py",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[tool.uv.sources]
kafka-client-py = { workspace = true }
kafka-consumer-py = { workspace = true }
kafka-messages-proto = { workspace = true }
correlation-py = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_service", "service_core", "background_workers", "health_probes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["service_core", "background_workers", "health_probes"]
