name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: write-service
            context: .
            dockerfile: services/write-service/Dockerfile
          - image: read-service
            context: .
            dockerfile: services/read-service/Dockerfile
          - image: ai-service
            context: .
            dockerfile: services/ai-service/Dockerfile
          - image: push-service
            context: .
            dockerfile: services/push-service/Dockerfile
          - image: webhook-service
            context: .
            dockerfile: services/webhook-service/Dockerfile
          - image: antifraud-service
            context: .
            dockerfile: services/antifraud-service/Dockerfile
          - image: api-gateway
            context: infrastructure/kong
            dockerfile: infrastructure/kong/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/isoldpower/power-finance/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/isoldpower/power-finance/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
