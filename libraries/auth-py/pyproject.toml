[project]
name = "auth-py"
version = "0.0.0"
description = "Shared authentication helpers: JWT decoding, Clerk adapter, DRF auth classes, Django middleware for JWT + throttling."
requires-python = ">=3.12"
dependencies = [
    "pyjwt>=2.11,<3.0",
    "clerk-backend-api>=5.0,<6.0",
    "cryptography>=46.0,<47.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auth_py"]
