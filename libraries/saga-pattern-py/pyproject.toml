[project]
name = "saga-pattern-py"
version = "0.0.0"
description = "Generic SAGA orchestration: ordered forward steps with reverse-order compensation. Shared by write- and read-side consumers."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saga_pattern_py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
