[project]
name = "correlation-py"
version = "0.0.0"
description = "Correlation ID middleware + propagation helpers for HTTP, Kafka, and database query comments."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "asgiref>=3.11,<4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["correlation"]
