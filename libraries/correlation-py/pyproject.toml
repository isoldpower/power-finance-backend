[project]
name = "correlation-py"
version = "0.0.0"
description = "Request-scoped correlation and sandbox binding for Django services, layered over the OpenTelemetry context carried by observability-py."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "asgiref>=3.11,<4.0",
    "observability-py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["correlation"]

[tool.uv.sources]
observability-py = { workspace = true }
