[project]
name = "filter-grammar-py"
version = "0.0.0"
description = "The filter_body grammar: operators, per-resource field policies, and a store-agnostic validator. A rule condition and a search query are the same question asked at different times, so both services validate against one table rather than two that can drift."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filter_grammar_py"]

[tool.pytest.ini_options]
testpaths = ["filter_grammar_py"]
