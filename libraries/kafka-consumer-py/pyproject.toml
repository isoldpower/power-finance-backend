[project]
name = "kafka-consumer-py"
version = "0.0.0"
description = "Async Kafka consumer runtime shared by services: outbox-envelope decoding, event routing, effect execution plans, health-guarded handlers and SIGTERM-aware consume loops."
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.11,<0.13",
    "protobuf>=5.29,<6.0",
    "kafka-client-py",
    "saga-pattern-py",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kafka_consumer_py"]

[tool.uv.sources]
kafka-client-py = { workspace = true }
saga-pattern-py = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["kafka_consumer_py"]
