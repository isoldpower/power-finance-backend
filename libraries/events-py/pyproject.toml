[project]
name = "events-py"
version = "0.0.0"
description = "Python codegen + helpers for Avro/Protobuf event schemas used by Async Kafka and Fraud Signals Kafka topics. Schemas live under schemas/."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["events_py"]
