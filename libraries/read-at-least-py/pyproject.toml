[project]
name = "read-at-least-py"
version = "0.0.0"
description = "Read-your-writes (Read-At-Least) primitives: compares a client's required outbox seq against the seq the read side has applied, deciding serve vs not-caught-up. Storage and transport are injected, so it stays framework-agnostic."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["read_at_least_py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["read_at_least_py"]
