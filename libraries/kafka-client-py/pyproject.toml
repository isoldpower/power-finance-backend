[project]
name = "kafka-client-py"
version = "0.0.0"
description = "Thin wrappers over the Kafka client (producer, idempotent consumer, retry/DLQ helpers) shared by Write Service and Read Service projection/cache-invalidation consumers."
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kafka_client_py"]
