[project]
name = "observability-py"
version = "0.0.0"
description = "OpenTelemetry tracing bootstrap, W3C context propagation, and sandbox baggage for Power Finance services."
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
]

[project.optional-dependencies]
django = [
    "opentelemetry-instrumentation-django>=0.48b0",
    "opentelemetry-instrumentation-psycopg>=0.48b0",
    "opentelemetry-instrumentation-asgi>=0.48b0",
    "opentelemetry-instrumentation-wsgi>=0.48b0",
]
asgi = [
    "opentelemetry-instrumentation-asgi>=0.48b0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
sqlalchemy = [
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]
datastores = [
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-elasticsearch>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["observability"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["observability"]
