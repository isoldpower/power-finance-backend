[project]
name = "observability-py"
version = "0.0.0"
description = "Structured logging, OpenTelemetry tracing setup, and shared health-check building blocks (DB, Redis, Kafka probes) used by all Python services."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["observability_py"]
