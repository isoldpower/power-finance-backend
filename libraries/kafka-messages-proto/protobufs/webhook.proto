syntax = "proto3";

package power_finance.events.v1;

option go_package = "github.com/power-finance/kafka-messages-proto/generated/go/events/v1;eventsv1";
option java_package = "com.powerfinance.events.v1";
option java_multiple_files = true;
option java_outer_classname = "WebhookProto";

import "google/protobuf/timestamp.proto";

enum WebhookDeliveryStatus {
  WEBHOOK_DELIVERY_STATUS_UNSPECIFIED = 0;
  WEBHOOK_DELIVERY_STATUS_IN_PROGRESS = 1;
  WEBHOOK_DELIVERY_STATUS_SUCCESS = 2;
  WEBHOOK_DELIVERY_STATUS_FAILED = 3;
  WEBHOOK_DELIVERY_STATUS_RETRY_SCHEDULED = 4;
}

message WebhookDeliveryStatusChanged {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  int32 schema_version = 3;

  string delivery_id = 10;
  string endpoint_id = 11;
  int32 user_id = 12;
  WebhookDeliveryStatus status = 13;
}

message WebhookEndpointCreated {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  int32 schema_version = 3;

  string webhook_id = 10;
  int32 user_id = 11;
  string title = 12;
  string url = 13;
  string secret = 14;
  google.protobuf.Timestamp created_at = 15;
  int32 secret_version = 16;
  bool enabled = 17;
}

message WebhookEndpointUpdated {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  int32 schema_version = 3;

  string webhook_id = 10;
  int32 user_id = 11;
  string title = 12;
  string url = 13;
  google.protobuf.Timestamp updated_at = 14;
  bool enabled = 15;
}

message WebhookEndpointDeleted {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  int32 schema_version = 3;

  string webhook_id = 10;
  int32 user_id = 11;
  google.protobuf.Timestamp deleted_at = 12;
}

message WebhookSecretRotated {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  int32 schema_version = 3;

  string webhook_id = 10;
  int32 user_id = 11;
  string secret = 12;
  google.protobuf.Timestamp rotated_at = 13;
  string previous_secret = 14;
  int32 secret_version = 15;
  int32 previous_secret_version = 16;
  google.protobuf.Timestamp previous_secret_expires_at = 17;
}

message WebhookSubscriptionAdded {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  int32 schema_version = 3;

  string subscription_id = 10;
  string webhook_id = 11;
  int32 user_id = 12;
  string event_type = 13;
  google.protobuf.Timestamp created_at = 14;
}

message WebhookSubscriptionRemoved {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  int32 schema_version = 3;

  string subscription_id = 10;
  string webhook_id = 11;
  int32 user_id = 12;
  google.protobuf.Timestamp removed_at = 13;
}
