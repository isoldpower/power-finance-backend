# See README.md → "Shared dev environment"
volumes:
  sandbox_local_postgres_data:

x-local-database-env: &local-database-env
  DATABASE_HOST: sbx-postgres
  DATABASE_PORT: "5432"
  DATABASE_USER: ${DATABASE_USER:-postgres}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}

services:
  sbx-postgres:
    image: postgres:18.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SANDBOX_DATABASE_PORT:-5633}:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${WRITE_DATABASE_NAME:-power_finance_write}
      PGDATA: /var/lib/postgresql/data/pgdata
      WRITE_DATABASE_NAME: ${WRITE_DATABASE_NAME:-power_finance_write}
      READ_DATABASE_NAME: ${READ_DATABASE_NAME:-power_finance_read}
      AI_DATABASE_NAME: ${AI_DATABASE_NAME:-power_finance_ai}
      WEBHOOK_DATABASE_NAME: ${WEBHOOK_DATABASE_NAME:-power_finance_webhooks}
    volumes:
      - sandbox_local_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/sandbox_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$$POSTGRES_PASSWORD" psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c 'select 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  sbx-write-migrate:
    extends:
      file: services/write-service/compose.yaml
      service: write-migrate
    depends_on: !reset {}
    environment:
      <<: *local-database-env
      DATABASE_NAME: ${WRITE_DATABASE_NAME:-power_finance_write}

  sbx-read-migrate:
    extends:
      file: services/read-service/compose.yaml
      service: read-migrate
    depends_on: !reset {}
    environment:
      <<: *local-database-env
      DATABASE_NAME: ${READ_DATABASE_NAME:-power_finance_read}

  sbx-ai-migrate:
    extends:
      file: services/ai-service/compose.yaml
      service: ai-migrate
    depends_on: !reset {}
    environment:
      AI_DATABASE_URL: postgresql+psycopg://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@sbx-postgres:5432/${AI_DATABASE_NAME:-power_finance_ai}

  sbx-webhook-migrate:
    extends:
      file: services/webhook-service/compose.yaml
      service: webhook-migrate
    depends_on: !reset {}
    environment:
      POSTGRES_DSN: postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@sbx-postgres:5432/${WEBHOOK_DATABASE_NAME:-power_finance_webhooks}
